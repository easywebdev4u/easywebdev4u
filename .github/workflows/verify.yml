name: verify profile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: SVG assets are well-formed
        run: |
          for f in assets/*.svg; do
            python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('$f')"
            echo "ok  $f"
          done

      - name: Light and dark variants have not diverged
        run: |
          # Compare element trees only: the palette is allowed to differ, the
          # structure is not. Catches editing one variant and forgetting the other.
          strip() { grep -oE '<[a-zA-Z/][^ >]*' "$1" | tr -d '<'; }
          status=0
          for pair in header architecture state; do
            if diff <(strip "assets/$pair-dark.svg") <(strip "assets/$pair-light.svg") > /dev/null; then
              echo "ok  $pair variants match"
            else
              echo "::error file=assets/$pair-light.svg::$pair-dark and $pair-light have diverged"
              status=1
            fi
          done
          exit $status

      - name: README is in sync with the site config
        run: |
          # The README is generated from the portfolio site's config. If someone
          # hand-edits README.md, or the site data changes without a regenerate,
          # this fails and names the drift.
          node scripts/generate.mjs
          if ! git diff --quiet -- README.md; then
            echo "::error::README.md is stale. Run: node scripts/generate.mjs"
            git diff --stat -- README.md
            git diff -- README.md | head -60
            exit 1
          fi
          echo "ok  README matches generated output"

      - name: External links resolve
        run: |
          fail=0
          # Process substitution, not a pipe: a pipe would run the loop in a
          # subshell and silently discard `fail`.
          while read -r url; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 20 \
                   -A 'profile-link-check' "$url" || echo 000)
            case "$code" in
              2*|3*) echo "ok   $code  $url" ;;
              000)   echo "::warning::unreachable $url" ;;
              *)     echo "::error::$code $url"; fail=1 ;;
            esac
          done < <(grep -oE 'https?://[^)"# ]+' README.md | sed 's/[.,]$//' | sort -u)
          exit $fail
