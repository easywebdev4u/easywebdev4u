name: verify profile

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly — catches links that rot after the fact.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SVG headers are well-formed
        run: |
          for f in assets/*.svg; do
            python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('$f')"
            echo "ok  $f"
          done

      - name: Light and dark headers stayed in sync
        run: |
          # Structure must match; only the palette may differ. Catches the case
          # where one variant is edited and the other silently drifts.
          strip() { grep -oE '<[a-zA-Z/][^ >]*' "$1" | tr -d '<'; }
          diff <(strip assets/header-dark.svg) <(strip assets/header-light.svg) \
            && echo "ok  element trees match" \
            || { echo "::error::header-dark.svg and header-light.svg have diverged"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Mermaid diagram compiles
        run: |
          awk '/^```mermaid$/{f=1;next} /^```$/{f=0} f' README.md > diagram.mmd
          if [ ! -s diagram.mmd ]; then echo "::error::no mermaid block found"; exit 1; fi
          npx --yes @mermaid-js/mermaid-cli@11 -i diagram.mmd -o /tmp/diagram.svg
          echo "ok  mermaid renders"

      - name: External links resolve
        run: |
          fail=0
          # Process substitution, not a pipe: a pipe would run the loop in a
          # subshell and silently discard `fail`.
          while read -r url; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 20 \
                   -A 'profile-link-check' "$url" || echo 000)
            case "$code" in
              2*|3*) echo "ok   $code  $url" ;;
              000)   echo "::warning::unreachable $url" ;;
              *)     echo "::error::$code $url"; fail=1 ;;
            esac
          done < <(grep -oE 'https?://[^)"# ]+' README.md | sed 's/[.,]$//' | sort -u)
          exit $fail
