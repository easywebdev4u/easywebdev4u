<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320" role="img" aria-label="KYC state machine. Submitted reaches Under review by either a provider acknowledgement or a webhook, in either order. Under review resolves to Approved or Rejected. Rejected returns to Submitted after remediation. Approved leads to Provisioned. Duplicate webhooks and replayed decisions are self-loops that change nothing.">
  <defs>
    <pattern id="g3" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#141c1e" stroke-width="1"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e4a55"/>
    </marker>
  </defs>

  <style><![CDATA[
    .bg   { fill: #0a0a0a; }
    .st   { fill: #101a1c; stroke: #1e3a42; stroke-width: 1.4; rx: 26; }
    .stok { fill: #0d2429; stroke: #06b6d4; stroke-width: 1.6; rx: 26; }
    .stno { fill: #1c1416; stroke: #7f3b45; stroke-width: 1.4; rx: 26; }
    .lbl  { fill: #d6e4e7; font-size: 14px; font-weight: 600; }
    .sub  { fill: #4d686e; font-size: 10.5px; letter-spacing: .5px; }
    .cap  { fill: #3f5a60; font-size: 12px; letter-spacing: 3px; }
    .note { fill: #56727a; font-size: 11.5px; font-style: italic; }
    .wire { fill: none; stroke: #1e4a55; stroke-width: 1.8; marker-end: url(#ar); }
    .loop { fill: none; stroke: #2a5f5c; stroke-width: 1.6; stroke-dasharray: 4 4; }
    .tok  { fill: #22d3ee; }
    .tok2 { fill: #f59e0b; }
    .tokr { fill: #ef7c8a; }

    /* The two edges into Under review carry tokens on different periods, so
       across cycles they arrive in both orders. That is the whole claim of
       this diagram, shown rather than asserted. */
    .e1 { offset-path: path("M176,146 C214,146 232,132 270,132"); animation: ride 3.1s linear infinite; }
    .e2 { offset-path: path("M176,146 C214,146 232,174 270,174"); animation: ride 4.3s linear infinite; }
    .e3 { offset-path: path("M406,140 C452,140 470,96 516,96");   animation: ride 3.7s linear infinite 1.1s; }
    .e4 { offset-path: path("M406,166 C452,166 470,222 516,222"); animation: ride 5.9s linear infinite 2.2s; }
    .e5 { offset-path: path("M646,96 H756");                       animation: ride 3.7s linear infinite 2.4s; }
    .e6 { offset-path: path("M886,96 H948");                       animation: ride 3.7s linear infinite 3.1s; }
    .e7 { offset-path: path("M581,248 C581,296 106,296 106,176");  animation: ride 5.9s linear infinite 3.6s; }

    /* Self-loops run continuously: a duplicate event is always in flight,
       and it never advances the machine. */
    .l1 { offset-path: path("M300,120 C300,66 372,66 372,120"); animation: ride 2.4s linear infinite; }
    .l2 { offset-path: path("M546,70 C546,26 616,26 616,70");   animation: ride 2.4s linear infinite 1.2s; }

    @keyframes ride {
      0%   { offset-distance: 0%;   opacity: 0 }
      12%  { opacity: 1 }
      88%  { opacity: 1 }
      100% { offset-distance: 100%; opacity: 0 }
    }
    @keyframes glow { 0%,100% { opacity: .35 } 50% { opacity: .9 } }
    .beat { animation: glow 3.2s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .e1,.e2,.e3,.e4,.e5,.e6,.e7,.l1,.l2 {
        animation: none; offset-distance: 55%; opacity: .95;
      }
      .beat { animation: none; opacity: .7 }
    }
  ]]></style>

  <rect class="bg" width="1100" height="320"/>
  <rect width="1100" height="320" fill="url(#g3)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text class="cap" x="26" y="38">KYC STATE MACHINE</text>
    <text class="sub" x="26" y="58">events may arrive in any order · duplicates must be no-ops</text>

    <g class="wire">
      <path d="M176,146 C214,146 232,132 270,132"/>
      <path d="M176,146 C214,146 232,174 270,174"/>
      <path d="M406,140 C452,140 470,96 516,96"/>
      <path d="M406,166 C452,166 470,222 516,222"/>
      <path d="M646,96 H756"/>
      <path d="M886,96 H948"/>
      <path d="M581,248 C581,296 106,296 106,176"/>
    </g>

    <g class="loop">
      <path d="M300,120 C300,66 372,66 372,120"/>
      <path d="M546,70 C546,26 616,26 616,70"/>
    </g>

    <rect class="st"   x="42"  y="120" width="134" height="56"/>
    <rect class="st"   x="270" y="120" width="136" height="56"/>
    <rect class="stok" x="516" y="70"  width="130" height="52"/>
    <rect class="stno" x="516" y="196" width="130" height="52"/>
    <rect class="stok" x="756" y="70"  width="130" height="52"/>
    <circle class="beat" cx="962" cy="96" r="9" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="962" cy="96" r="3.5" fill="#06b6d4"/>

    <g class="lbl" text-anchor="middle">
      <text x="109" y="145">Submitted</text>
      <text x="338" y="145">Under review</text>
      <text x="581" y="94">Approved</text>
      <text x="581" y="220">Rejected</text>
      <text x="821" y="94">Provisioned</text>
    </g>
    <g class="sub" text-anchor="middle">
      <text x="109" y="163">intent recorded</text>
      <text x="338" y="163">accepts either order</text>
      <text x="581" y="110">decision</text>
      <text x="581" y="236">recoverable</text>
      <text x="821" y="110">wallet created</text>
    </g>

    <g class="sub">
      <text x="196" y="122" fill="#22d3ee">provider ack</text>
      <text x="196" y="192" fill="#f59e0b">webhook</text>
      <text x="336" y="60"  fill="#2a7f7a" text-anchor="middle">duplicate webhook → no-op</text>
      <text x="581" y="20"  fill="#2a7f7a" text-anchor="middle">replayed decision → no-op</text>
      <text x="330" y="292" fill="#56727a">user remediates, resubmits</text>
    </g>

    <text class="note" x="26" y="308">Neither entry edge is guaranteed first. The machine must be correct under both orders — and under both, twice.</text>
  </g>

  <circle class="tok  e1" r="4.5"/>
  <circle class="tok2 e2" r="4.5"/>
  <circle class="tok  e3" r="4"/>
  <circle class="tokr e4" r="4"/>
  <circle class="tok  e5" r="4"/>
  <circle class="tok  e6" r="4"/>
  <circle class="tokr e7" r="4"/>
  <circle class="tok2 l1" r="3.5"/>
  <circle class="tok2 l2" r="3.5"/>
</svg>
